# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true

jobs:
  build-macos:
    runs-on: macos-11
    if: false
    strategy:
      matrix:
        python-version: ['none', '3.10.0-alpha.6', '3.10.0-alpha.5', '3.10.0-alpha.4', '3.10.0-alpha.3', '3.10.0-alpha.2', '3.10.0-alpha.1', '3.9.2', '3.9.2-rc.1', '3.9.1', '3.9.1-rc.1', '3.9.0', '3.9.0-rc.2', '3.9.0-rc.1', '3.9.0-beta.5', '3.9.0-beta.4', '3.8.8', '3.8.7', '3.8.6', '3.8.5', '3.8.4', '3.8.3', '3.8.2', '3.8.1', '3.8.0', '3.7.10', '3.7.9', '3.7.8', '3.7.7', '3.7.6', '3.7.5', '3.7.1', '3.6.13', '3.6.12', '3.6.11', '3.6.10', '3.6.9', '3.6.8', '3.6.7', '3.5.10', '3.5.9', '3.5.4', '2.7.18', '2.7.17']
    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ github.event.inputs.branch }}
    - run: |
        echo Python
        which -a python
        echo \nPython 2
        which -a python2
        echo \nPython 3
        which -a python3
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
      if: matrix.python-version != 'none'
    - run: |
        echo Python
        which -a python
        echo \nPython 2
        which -a python2
        echo \nPython 3
        which -a python3
      if: matrix.python-version != 'none'
    - name: Print info (Python)
      run: |
        python -VV
        python test.py
    - name: Print info (Python 2)
      run: |
        python2 -VV
        python2 test.py
      # if: startsWith(matrix.python-version, '2')
    - name: Print info (Python 3)
      run: |
        python3 -VV
        python3 test.py
      # if: startsWith(matrix.python-version, '3')
  build-windows:
    if: false
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['none', '3.10.0-alpha.6', '3.10.0-alpha.5', '3.10.0-alpha.4', '3.10.0-alpha.3', '3.10.0-alpha.2', '3.10.0-alpha.1', '3.9.2', '3.9.2-rc.1', '3.9.1', '3.9.1-rc.1', '3.9.0', '3.9.0-rc.2', '3.9.0-rc.1', '3.9.0-beta.5', '3.9.0-beta.4', '3.8.8', '3.8.7', '3.8.6', '3.8.5', '3.8.4', '3.8.3', '3.8.2', '3.8.1', '3.8.0', '3.7.9', '3.7.8', '3.7.7', '3.7.6', '3.7.5', '3.7.1', '3.6.8', '3.6.7', '3.5.4', '3.4.4', '3.3.5', '3.2.5', '3.1.4', '3.0.1', '2.7.18', '2.7.17']
    steps:
    - uses: actions/checkout@v2
    - run: |
        echo Python
        which -a python
        echo \nPython 2
        which -a python2
        echo \nPython 3
        which -a python3
    - run: where python
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
      if: matrix.python-version != 'none'
    - run: |
        echo Python
        which -a python
        echo \nPython 2
        which -a python2
        echo \nPython 3
        which -a python3
      if: matrix.python-version != 'none'
    - name: Print info (Python)
      run: |
        python -VV
        python test.py
    - name: Print info (Python 2)
      run: |
        python2 -VV
        python2 test.py
      # if: startsWith(matrix.python-version, '2')
    - name: Print info (Python 3)
      run: |
        python3 -VV
        python3 test.py
      # if: startsWith(matrix.python-version, '3')
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['none', "3.14.0-alpha.4", "3.14.0-alpha.3", "3.14.0-alpha.2", "3.14.0-alpha.1", "3.14.0-alpha.0", "3.13.1", "3.13.0", "3.13.0-rc.3", "3.13.0-rc.2", "3.13.0-rc.1", "3.13.0-beta.4", "3.13.0-beta.3", "3.13.0-beta.2", "3.13.0-beta.1", "3.12.8", "3.12.7", "3.12.6", "3.12.5", "3.12.4", "3.12.3", "3.12.2", "3.12.1", "3.12.0", "3.11.11", "3.11.10", "3.11.9", "3.11.8", "3.11.7", "3.11.6", "3.11.5", "3.11.4", "3.11.3", "3.11.2", "3.11.1", "3.11.0", "3.10.16", "3.10.15", "3.10.14", "3.10.13", "3.10.12", "3.10.11", "3.10.10", "3.10.9", "3.10.8", "3.10.7", "3.10.6", "3.10.5", "3.10.4", "3.9.21", "3.9.20", "3.9.19", "3.9.18", "3.9.17", "3.9.16", "3.9.15", "3.9.14", "3.9.13", "3.9.12", "3.8.18", "3.8.17", "3.8.16", "3.8.15", "3.8.14", "3.8.13", "3.8.12"]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - run: |
        echo Python
        which -a python
        echo Python 3
        which -a python3
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
      if: matrix.python-version != 'none'
    - run: |
        echo Python
        which -a python
        echo Python 3
        which -a python3
      if: matrix.python-version != 'none'
    - name: Print info (Python)
      run: |
        python -VV
        python test.py
    - name: Print info (Python 3)
      run: |
        python3 -VV
        python3 test.py
      # if: startsWith(matrix.python-version, '3')
    - run: sleep 30
        
